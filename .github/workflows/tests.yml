name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: erp
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp_local_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp_local_password

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the pipeline against a real database
        run: python -m src.pipeline

      - name: Verify the pipeline is idempotent
        run: |
          python -m src.pipeline --quiet
          python - <<'PY'
          from sqlalchemy import text
          from src.config import make_engine
          with make_engine().connect() as conn:
              runs = conn.execute(text(
                  "SELECT rows_inserted, rows_updated FROM pipeline_runs"
                  " ORDER BY run_id"
              )).all()
          first, second = runs[0], runs[1]
          assert first == (545, 0), f"first run was {first}"
          assert second == (0, 545), f"second run was {second}"
          print("idempotent: run 1", first, "/ run 2", second)
          PY

      - name: Tests
        run: python -m pytest

      - name: Build the static site
        run: python scripts/build_site.py --out /tmp/site
